plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.comprehensive.eureka'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.projectlombok:lombok:1.18.28'
    testImplementation 'org.projectlombok:lombok:1.18.28'
	testImplementation 'org.projectlombok:lombok:1.18.28'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 트랜잭션 경계 회귀 테스트(H2)와 Redis 기반 세션·락 통합 테스트(Testcontainers)
	testRuntimeOnly 'com.h2database:h2'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
	testImplementation 'org.testcontainers:junit-jupiter'

	implementation 'dev.langchain4j:langchain4j:1.0.1'
	implementation 'dev.langchain4j:langchain4j-open-ai:1.0.1'

	implementation 'io.github.vaneproject:badwordfiltering:1.0.0'
	//webClient 사용을 위한 WebFlux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.ahocorasick:ahocorasick:0.6.3'
	implementation 'org.redisson:redisson:3.40.2'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'benchmark'
	}
}

// 성능 측정 전용: ./gradlew benchmarkTest (결과는 build/reports/benchmark)
tasks.register('benchmarkTest', Test) {
	description = '금칙어 필터 등 성능 측정 테스트를 실행합니다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'benchmark'
	}
	outputs.upToDateWhen { false }
}
